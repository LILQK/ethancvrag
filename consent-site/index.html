<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Career RAG · Authorize</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#111; --muted:#666; --line:#ddd; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; } }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  main { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:380px; }
  h1 { font-size:18px; margin:0 0 12px; }
  p.muted { color:var(--muted); margin:4px 0 16px; font-size:13px; word-break:break-all; }
  label { display:block; font-size:13px; margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  button { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; margin-top:16px; }
  .row button { flex:1; }
  .err { color:#d1242f; font-size:13px; min-height:1em; margin-top:10px; }
  .hidden { display:none; }
  ul { padding-left:18px; margin:6px 0; }
</style>
</head>
<body>
<main>
  <h1>Career RAG</h1>
  <section id="loading"><p class="muted">Loading…</p></section>

  <form id="login" class="hidden">
    <p class="muted">Sign in to authorize an AI client to access your private career memory.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required="required" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required="required" />
    <div class="row"><button class="primary" type="submit">Sign in</button></div>
  </form>

  <section id="consent" class="hidden">
    <p><strong id="client"></strong> wants access to your Career RAG.</p>
    <p class="muted">Redirect: <span id="redirect"></span></p>
    <p class="muted">Scopes: <span id="scopes"></span></p>
    <p class="muted">Signed in as <span id="who"></span>.</p>
    <div class="row">
      <button id="deny" type="button">Deny</button>
      <button id="approve" class="primary" type="button">Approve</button>
    </div>
    <div class="row"><button id="signout" type="button">Use another account</button></div>
  </section>

  <section id="done" class="hidden"><p class="muted" id="donemsg">Redirecting…</p></section>
  <div class="err" id="err"></div>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient("https://bcsdgszzdiyibrfzogid.supabase.co", "sb_publishable_-Yv_wGOJABUoCMZQGY-Y4A_3XhYRPwx");
const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ["loading", "login", "consent", "done"]) $(s).classList.toggle("hidden", s !== id); };
const fail = (m) => { $("err").textContent = m; };
const authorizationId = new URLSearchParams(location.search).get("authorization_id");

function go(url) { show("done"); location.assign(url); }

async function loadConsent() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { show("login"); return; }
  const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
  if (error) { fail(error.message); show("login"); return; }
  if (data.redirect_url && !data.authorization_id) { go(data.redirect_url); return; }
  $("client").textContent = data.client?.name || data.client?.client_name || data.client?.id || "An OAuth client";
  $("redirect").textContent = data.redirect_uri || "";
  $("scopes").textContent = data.scope || data.scopes || "default";
  $("who").textContent = data.user?.email || session.user.email;
  show("consent");
}

$("login").addEventListener("submit", async (ev) => {
  ev.preventDefault(); fail("");
  const { error } = await supabase.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) { fail(error.message); return; }
  await loadConsent();
});

$("approve").addEventListener("click", async () => {
  fail("");
  const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId);
  if (error) { fail(error.message); return; }
  go(data.redirect_url || data.redirect_to);
});

$("deny").addEventListener("click", async () => {
  const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId);
  if (error) { fail(error.message); return; }
  go(data.redirect_url || data.redirect_to);
});

$("signout").addEventListener("click", async () => { await supabase.auth.signOut(); show("login"); });

if (!authorizationId) { show("done"); $("donemsg").textContent = "Missing authorization_id. Start the connection from your AI client."; }
else loadConsent().catch((e) => { fail(String(e?.message || e)); show("login"); });
</script>
</body>
</html>
